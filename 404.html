<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stranica nije pronađena - Razmeni</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .error-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      text-align: center;
      padding: 2rem;
    }

    .error-content {
      max-width: 600px;
    }

    .error-code {
      font-size: 120px;
      font-weight: 700;
      line-height: 1;
      margin-bottom: 1rem;
      opacity: 0.9;
    }

    .error-title {
      font-size: 32px;
      font-weight: 600;
      margin-bottom: 1rem;
    }

    .error-message {
      font-size: 18px;
      opacity: 0.9;
      margin-bottom: 2rem;
      line-height: 1.6;
    }

    .error-actions {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn-white {
      background: white;
      color: #667eea;
      padding: 0.875rem 2rem;
      border-radius: var(--radius);
      font-weight: 600;
      font-size: 16px;
      text-decoration: none;
      display: inline-block;
      transition: all 0.2s;
      border: none;
      cursor: pointer;
    }

    .btn-white:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
    }

    .btn-outline {
      background: transparent;
      color: white;
      padding: 0.875rem 2rem;
      border-radius: var(--radius);
      font-weight: 600;
      font-size: 16px;
      text-decoration: none;
      display: inline-block;
      transition: all 0.2s;
      border: 2px solid rgba(255, 255, 255, 0.5);
      cursor: pointer;
    }

    .btn-outline:hover {
      border-color: white;
      background: rgba(255, 255, 255, 0.1);
    }

    @media (max-width: 768px) {
      .error-code {
        font-size: 80px;
      }

      .error-title {
        font-size: 24px;
      }

      .error-message {
        font-size: 16px;
      }

      .error-actions {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="error-container">
    <div class="error-content">
      <div class="error-code">404</div>
      <h1 class="error-title">Stranica nije pronađena</h1>
      <p class="error-message">
        Žao nam je, ali stranica koju tražite ne postoji ili je premeštena.
        Možda je obrisana ili je pogrešna adresa uneta.
      </p>
      <div class="error-actions">
        <a href="index.html" class="btn-white">Početna stranica</a>
        <a href="listings.html" class="btn-outline">Pregledaj oglase</a>
        <button onclick="window.history.back()" class="btn-outline">Nazad</button>
      </div>
    </div>
  </div>
</body>
</html>
