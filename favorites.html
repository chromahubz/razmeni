<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Omiljeni oglasi - Razmeni</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .favorites-container {
      padding: 3rem 0;
      background: var(--gray-50);
      min-height: 100vh;
    }

    .page-header {
      margin-bottom: 2rem;
    }

    .page-header h1 {
      font-size: 32px;
      font-weight: 700;
      color: var(--gray-900);
      margin-bottom: 0.5rem;
    }

    .page-header p {
      color: var(--gray-600);
      font-size: 16px;
    }

    .listings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.5rem;
    }

    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      background: white;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
    }

    .empty-state-icon {
      font-size: 64px;
      margin-bottom: 1rem;
      opacity: 0.3;
    }

    .empty-state h2 {
      font-size: 24px;
      font-weight: 600;
      color: var(--gray-900);
      margin-bottom: 0.5rem;
    }

    .empty-state p {
      color: var(--gray-600);
      margin-bottom: 1.5rem;
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="container navbar-content">
      <!-- Navbar will be rendered by navbar.js -->
    </div>
  </nav>

  <div class="favorites-container">
    <div class="container">
      <div class="page-header">
        <h1>Omiljeni oglasi</h1>
        <p>Sačuvani oglasi koji vas interesuju</p>
      </div>

      <div id="favoritesContent"></div>
    </div>
  </div>

  <script src="js/mockData.js"></script>
  <script src="js/dataManager.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/toast.js"></script>
  <script>
    // Check if logged in
    if (!dataManager.isLoggedIn()) {
      window.location.href = 'login.html';
    }

    const currentUser = dataManager.getCurrentUser();

    // Get favorites
    const favorites = JSON.parse(localStorage.getItem('favorites') || '[]');
    const myFavorites = favorites.filter(f => f.userId === currentUser.id);

    // Get listings
    const favoriteListings = myFavorites.map(fav => {
      return dataManager.getListingById(fav.listingId);
    }).filter(l => l !== null);

    function renderFavorites() {
      const container = document.getElementById('favoritesContent');

      if (favoriteListings.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">♡</div>
            <h2>Nemate omiljenih oglasa</h2>
            <p>Dodajte oglase u omiljene da biste ih brže pronašli</p>
            <a href="listings.html" class="btn btn-primary">Pregledaj oglase</a>
          </div>
        `;
        return;
      }

      container.innerHTML = `
        <div class="listings-grid">
          ${favoriteListings.map(listing => createListingCard(listing)).join('')}
        </div>
      `;
    }

    function createListingCard(listing) {
      const imageUrl = listing.images && listing.images.length > 0
        ? listing.images[0]
        : 'https://via.placeholder.com/400x300?text=Razmeni';

      return `
        <div class="listing-card" style="position: relative;">
          <button
            class="favorite-btn active"
            onclick="removeFavorite(${listing.id})"
            style="position: absolute; top: 1rem; right: 1rem; z-index: 10; background: white; border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; box-shadow: var(--shadow-md); display: flex; align-items: center; justify-content: center; font-size: 20px;"
          >
            ♥
          </button>
          <a href="listing-detail.html?id=${listing.id}" style="text-decoration: none; color: inherit;">
            <img src="${imageUrl}" alt="${listing.title}" class="listing-image">
            <div class="listing-content">
              <div class="listing-category">${listing.categoryName}</div>
              <h3 class="listing-title">${listing.title}</h3>
              <p class="listing-description">${listing.description.substring(0, 80)}...</p>
              <div class="listing-footer">
                <div class="listing-points">${listing.points} poena</div>
                <div class="listing-location">${listing.locationCity}</div>
              </div>
            </div>
          </a>
        </div>
      `;
    }

    function removeFavorite(listingId) {
      event.stopPropagation();
      event.preventDefault();

      const result = dataManager.toggleFavorite(listingId);
      if (result.success) {
        Toast.success('Uklonjeno iz omiljenih');
        setTimeout(() => location.reload(), 500);
      } else {
        Toast.error('Greška: ' + result.error);
      }
    }

    // Initial render
    renderFavorites();
  </script>
</body>
</html>
