<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Achievement-i & Rangiranje - Razmeni</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .level-card {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 2rem;
      border-radius: var(--radius-lg);
      margin-bottom: 2rem;
      text-align: center;
    }

    .level-icon {
      font-size: 64px;
      margin-bottom: 1rem;
    }

    .level-name {
      font-size: 36px;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .level-progress {
      background: rgba(255, 255, 255, 0.2);
      height: 12px;
      border-radius: 10px;
      overflow: hidden;
      margin: 1rem 0;
    }

    .level-progress-bar {
      background: white;
      height: 100%;
      transition: width 0.3s;
    }

    .achievements-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 1.5rem;
      margin-bottom: 3rem;
    }

    .achievement-card {
      background: white;
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      text-align: center;
      box-shadow: var(--shadow);
      transition: all 0.3s;
      position: relative;
    }

    .achievement-card.unlocked {
      border: 2px solid #10b981;
    }

    .achievement-card.locked {
      opacity: 0.5;
      filter: grayscale(100%);
    }

    .achievement-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg);
    }

    .achievement-icon {
      font-size: 48px;
      margin-bottom: 0.75rem;
    }

    .achievement-name {
      font-weight: 700;
      font-size: 18px;
      margin-bottom: 0.5rem;
    }

    .achievement-desc {
      font-size: 14px;
      color: var(--gray-600);
      margin-bottom: 0.75rem;
    }

    .achievement-points {
      background: var(--primary);
      color: white;
      padding: 0.25rem 0.75rem;
      border-radius: 12px;
      font-weight: 600;
      font-size: 14px;
    }

    .unlock-badge {
      position: absolute;
      top: -10px;
      right: -10px;
      background: #10b981;
      color: white;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      box-shadow: 0 2px 8px rgba(16, 185, 129, 0.4);
    }

    .leaderboard {
      background: white;
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .leaderboard-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 1.5rem;
      text-align: center;
    }

    .leaderboard-header h2 {
      margin: 0;
      font-size: 28px;
    }

    .leaderboard-item {
      display: flex;
      align-items: center;
      padding: 1.25rem;
      border-bottom: 1px solid var(--gray-200);
      transition: background 0.2s;
    }

    .leaderboard-item:hover {
      background: var(--gray-50);
    }

    .leaderboard-rank {
      font-size: 24px;
      font-weight: 700;
      width: 50px;
      text-align: center;
    }

    .rank-1 { color: #FFD700; }
    .rank-2 { color: #C0C0C0; }
    .rank-3 { color: #CD7F32; }

    .leaderboard-avatar {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: var(--gray-300);
      margin: 0 1rem;
    }

    .leaderboard-info {
      flex: 1;
    }

    .leaderboard-name {
      font-weight: 700;
      font-size: 16px;
      margin-bottom: 0.25rem;
    }

    .leaderboard-level {
      font-size: 14px;
      color: var(--gray-600);
    }

    .leaderboard-stats {
      display: flex;
      gap: 1.5rem;
      align-items: center;
    }

    .stat-item {
      text-align: center;
    }

    .stat-value {
      font-size: 18px;
      font-weight: 700;
      color: var(--primary);
    }

    .stat-label {
      font-size: 12px;
      color: var(--gray-600);
    }

    .daily-reward {
      background: linear-gradient(135deg, #f59e0b 0%, #f97316 100%);
      color: white;
      padding: 1.5rem;
      border-radius: var(--radius-lg);
      text-align: center;
      margin-bottom: 2rem;
    }

    .daily-reward h3 {
      margin: 0 0 0.5rem 0;
      font-size: 24px;
    }

    .tabs {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
      border-bottom: 2px solid var(--gray-200);
    }

    .tab {
      padding: 0.75rem 1.5rem;
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      font-weight: 600;
      color: var(--gray-600);
      cursor: pointer;
      transition: all 0.3s;
    }

    .tab.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="container navbar-content">
      <!-- Navbar will be rendered by navbar.js -->
    </div>
  </nav>

  <section class="section">
    <div class="container">
      <div class="section-header">
        <h1>🏆 Achievement-i & Rangiranje</h1>
        <p>Prati svoj progres i takmiči se sa drugim korisnicima</p>
      </div>

      <!-- Daily Reward -->
      <div class="daily-reward" id="dailyReward">
        <h3>🎁 Dnevni Reward</h3>
        <p style="margin-bottom: 1rem;">Claim-uj +5 poena svaki dan!</p>
        <button class="btn btn-lg" style="background: white; color: #f59e0b;" onclick="claimDaily()">
          Claim Reward
        </button>
      </div>

      <!-- Level Card -->
      <div class="level-card">
        <div class="level-icon" id="levelIcon">🥉</div>
        <div class="level-name" id="levelName">Bronze</div>
        <div id="levelPoints" style="font-size: 20px; margin-bottom: 1rem;">0 poena</div>
        <div class="level-progress">
          <div class="level-progress-bar" id="levelProgressBar" style="width: 0%"></div>
        </div>
        <div id="nextLevelInfo" style="opacity: 0.9;">Još 100 poena do Silver nivoa</div>
      </div>

      <!-- Tabs -->
      <div class="tabs">
        <button class="tab active" onclick="switchTab('achievements', this)">Moji Achievement-i</button>
        <button class="tab" onclick="switchTab('leaderboard', this)">Leaderboard</button>
      </div>

      <!-- Achievements Tab -->
      <div id="achievementsTab" class="tab-content">
        <h2 style="margin-bottom: 1.5rem;">🎯 Moji Achievement-i</h2>
        <div class="achievements-grid" id="achievementsGrid">
          <!-- Achievements će biti ubačeni -->
        </div>
      </div>

      <!-- Leaderboard Tab -->
      <div id="leaderboardTab" class="tab-content" style="display: none;">
        <div class="leaderboard">
          <div class="leaderboard-header">
            <h2>🏆 Top Traders</h2>
            <p style="margin: 0; opacity: 0.9;">Najuspešniji korisnici ovog meseca</p>
          </div>
          <div id="leaderboardList">
            <!-- Leaderboard će biti ubačen -->
          </div>
        </div>
      </div>
    </div>
  </section>

  <script src="js/mockData.js"></script>
  <script src="js/dataManager.js"></script>
  <script src="js/gamification.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/toast.js"></script>
  <script>
    // Check if logged in
    if (!dataManager.isLoggedIn()) {
      window.location.href = 'login.html';
    }

    const currentUser = dataManager.getCurrentUser();

    // Load user level
    function loadUserLevel() {
      const level = gamificationSystem.getUserLevel(currentUser);
      const totalPoints = gamificationSystem.getTotalGamificationPoints(currentUser.id);

      document.getElementById('levelIcon').textContent = level.icon;
      document.getElementById('levelName').textContent = level.name;
      document.getElementById('levelName').style.color = level.color;
      document.getElementById('levelPoints').textContent = `${totalPoints} poena`;

      // Progress bar
      const progress = ((totalPoints - level.minPoints) / (level.maxPoints - level.minPoints)) * 100;
      document.getElementById('levelProgressBar').style.width = Math.min(progress, 100) + '%';

      // Next level info
      const nextLevel = gamificationSystem.levels[level.level]; // Next level (zero-indexed)
      if (nextLevel) {
        const needed = nextLevel.minPoints - totalPoints;
        document.getElementById('nextLevelInfo').textContent =
          `Još ${needed} poena do ${nextLevel.name} nivoa`;
      } else {
        document.getElementById('nextLevelInfo').textContent = 'Maksimalan nivo dostignut! 👑';
      }
    }

    // Load achievements
    function loadAchievements() {
      const unlockedAchievements = gamificationSystem.getUserAchievements(currentUser.id);
      const unlockedIds = unlockedAchievements.map(a => a.achievementId);
      const container = document.getElementById('achievementsGrid');

      container.innerHTML = gamificationSystem.achievements.map(achievement => {
        const isUnlocked = unlockedIds.includes(achievement.id);

        return `
          <div class="achievement-card ${isUnlocked ? 'unlocked' : 'locked'}">
            ${isUnlocked ? '<div class="unlock-badge">✓</div>' : ''}
            <div class="achievement-icon">${achievement.icon}</div>
            <div class="achievement-name">${achievement.name}</div>
            <div class="achievement-desc">${achievement.description}</div>
            <span class="achievement-points">+${achievement.points} poena</span>
          </div>
        `;
      }).join('');
    }

    // Load leaderboard
    function loadLeaderboard() {
      const leaderboard = gamificationSystem.getLeaderboard('all', 20);
      const container = document.getElementById('leaderboardList');

      container.innerHTML = leaderboard.map((entry, index) => {
        const rank = index + 1;
        const isCurrentUser = entry.userId === currentUser.id;

        return `
          <div class="leaderboard-item" style="${isCurrentUser ? 'background: #eff6ff;' : ''}">
            <div class="leaderboard-rank rank-${rank}">${rank <= 3 ? ['🥇', '🥈', '🥉'][rank - 1] : rank}</div>
            <div class="leaderboard-avatar"></div>
            <div class="leaderboard-info">
              <div class="leaderboard-name">
                ${entry.name} ${isCurrentUser ? '(TI)' : ''}
              </div>
              <div class="leaderboard-level">
                ${entry.level.icon} ${entry.level.name} | ${entry.achievements} achievement-a
              </div>
            </div>
            <div class="leaderboard-stats">
              <div class="stat-item">
                <div class="stat-value">${entry.totalPoints}</div>
                <div class="stat-label">Poena</div>
              </div>
              <div class="stat-item">
                <div class="stat-value">${entry.totalTrades}</div>
                <div class="stat-label">Razmene</div>
              </div>
              <div class="stat-item">
                <div class="stat-value">${entry.trustScore}</div>
                <div class="stat-label">Trust</div>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // Claim daily reward
    function claimDaily() {
      const result = gamificationSystem.claimDailyReward(currentUser.id);

      if (result.success) {
        Toast.success('🎁 Claim-ovao si +5 poena!');

        // Check for new achievements
        if (result.newAchievements && result.newAchievements.length > 0) {
          result.newAchievements.forEach(achievement => {
            setTimeout(() => {
              Toast.success(`🎉 Novo Achievement: ${achievement.name}! +${achievement.points} poena`);
            }, 500);
          });
        }

        // Reload page data
        setTimeout(() => {
          loadUserLevel();
          loadAchievements();
          loadLeaderboard();
        }, 1000);
      } else {
        Toast.warning(result.error);
      }
    }

    // Switch tabs
    function switchTab(tab, clickedElement) {
      // Update active tab
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      if (clickedElement) {
        clickedElement.classList.add('active');
      }

      // Show/hide content
      document.getElementById('achievementsTab').style.display = tab === 'achievements' ? 'block' : 'none';
      document.getElementById('leaderboardTab').style.display = tab === 'leaderboard' ? 'block' : 'none';
    }

    // Load initial data
    loadUserLevel();
    loadAchievements();
    loadLeaderboard();

    // Check for new achievements
    const newAchievements = gamificationSystem.checkAchievements(currentUser.id);
    if (newAchievements.length > 0) {
      newAchievements.forEach(achievement => {
        Toast.success(`🎉 Novo Achievement: ${achievement.name}! +${achievement.points} poena`);
      });
      setTimeout(() => location.reload(), 2000);
    }
  </script>
</body>
</html>
