<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registracija - Razmeni</title>
  <link rel="stylesheet" href="css/styles.css?v=2">
  <style>
    .auth-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--gray-50);
      padding: 2rem;
    }

    .auth-card {
      background: white;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      padding: 3rem;
      max-width: 480px;
      width: 100%;
    }

    .auth-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .auth-header h1 {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .auth-header p {
      color: var(--gray-600);
      font-size: 15px;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: var(--gray-900);
    }

    .form-input {
      width: 100%;
      padding: 0.875rem 1rem;
      border: 1px solid var(--gray-300);
      border-radius: var(--radius);
      font-size: 15px;
      transition: all 0.2s;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.1);
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .form-error {
      color: #dc2626;
      font-size: 14px;
      margin-top: 0.5rem;
      display: none;
    }

    .form-error.show {
      display: block;
    }

    .btn-submit {
      width: 100%;
      padding: 1rem;
      font-size: 16px;
      font-weight: 600;
      margin-top: 1rem;
    }

    .auth-footer {
      text-align: center;
      margin-top: 2rem;
      padding-top: 2rem;
      border-top: 1px solid var(--gray-200);
      font-size: 14px;
      color: var(--gray-600);
    }

    .auth-footer a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }

    .auth-footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <h1>Kreiraj nalog</h1>
        <p>Pridruži se Razmeni zajednici</p>
      </div>

      <form id="registerForm">
        <div class="form-group">
          <label class="form-label" for="fullName">Ime i prezime</label>
          <input
            type="text"
            id="fullName"
            class="form-input"
            placeholder="Marko Marković"
            required
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email adresa</label>
          <input
            type="email"
            id="email"
            class="form-input"
            placeholder="vas@email.com"
            required
          >
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="phone">Telefon</label>
            <input
              type="tel"
              id="phone"
              class="form-input"
              placeholder="060 123 4567"
            >
          </div>

          <div class="form-group">
            <label class="form-label" for="city">Grad</label>
            <input
              type="text"
              id="city"
              class="form-input"
              placeholder="Beograd"
            >
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Lozinka</label>
          <input
            type="password"
            id="password"
            class="form-input"
            placeholder="Minimum 6 karaktera"
            required
            minlength="6"
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="confirmPassword">Potvrdi lozinku</label>
          <input
            type="password"
            id="confirmPassword"
            class="form-input"
            placeholder="Ponovi lozinku"
            required
          >
        </div>

        <div class="form-error" id="errorMessage"></div>

        <button type="submit" class="btn btn-primary btn-submit">
          Registruj se
        </button>
      </form>

      <div class="auth-footer">
        Već imate nalog? <a href="login.html">Prijavite se</a>
      </div>

      <div class="auth-footer" style="border: none; padding-top: 1rem;">
        <a href="index.html">Nazad na početnu</a>
      </div>
    </div>
  </div>

  <script src="js/mockData.js"></script>
  <script src="js/dataManager.js"></script>
  <script src="js/navbar.js"></script>
  <script>
    document.getElementById('registerForm').addEventListener('submit', (e) => {
      e.preventDefault();

      const fullName = document.getElementById('fullName').value;
      const email = document.getElementById('email').value;
      const phone = document.getElementById('phone').value;
      const city = document.getElementById('city').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const errorMessage = document.getElementById('errorMessage');

      // Validation
      if (password !== confirmPassword) {
        errorMessage.textContent = 'Lozinke se ne podudaraju';
        errorMessage.classList.add('show');
        return;
      }

      if (password.length < 6) {
        errorMessage.textContent = 'Lozinka mora imati minimum 6 karaktera';
        errorMessage.classList.add('show');
        return;
      }

      const result = dataManager.register({
        email,
        password,
        fullName,
        phone,
        locationCity: city
      });

      if (result.success) {
        window.location.href = 'dashboard.html';
      } else {
        errorMessage.textContent = result.error;
        errorMessage.classList.add('show');
      }
    });

    // Check if already logged in
    if (dataManager.isLoggedIn()) {
      window.location.href = 'dashboard.html';
    }
  </script>
</body>
</html>
