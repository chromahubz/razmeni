<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prijava - Razmeni</title>
  <link rel="stylesheet" href="css/styles.css?v=2">
  <style>
    .auth-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--gray-50);
      padding: 2rem;
    }

    .auth-card {
      background: white;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      padding: 3rem;
      max-width: 420px;
      width: 100%;
    }

    .auth-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .auth-header h1 {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .auth-header p {
      color: var(--gray-600);
      font-size: 15px;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: var(--gray-900);
    }

    .form-input {
      width: 100%;
      padding: 0.875rem 1rem;
      border: 1px solid var(--gray-300);
      border-radius: var(--radius);
      font-size: 15px;
      transition: all 0.2s;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.1);
    }

    .form-error {
      color: #dc2626;
      font-size: 14px;
      margin-top: 0.5rem;
      display: none;
    }

    .form-error.show {
      display: block;
    }

    .btn-submit {
      width: 100%;
      padding: 1rem;
      font-size: 16px;
      font-weight: 600;
      margin-top: 1rem;
    }

    .auth-footer {
      text-align: center;
      margin-top: 2rem;
      padding-top: 2rem;
      border-top: 1px solid var(--gray-200);
      font-size: 14px;
      color: var(--gray-600);
    }

    .auth-footer a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }

    .auth-footer a:hover {
      text-decoration: underline;
    }

    .demo-hint {
      background: var(--gray-100);
      padding: 1rem;
      border-radius: var(--radius);
      font-size: 13px;
      color: var(--gray-700);
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .demo-hint strong {
      color: var(--gray-900);
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <h1>Dobrodošli nazad</h1>
        <p>Prijavite se na vaš Razmeni nalog</p>
      </div>

      <div class="demo-hint">
        💡 Demo nalog: <strong>demo@razmeni.rs</strong> / <strong>demo123</strong>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label class="form-label" for="email">Email adresa</label>
          <input
            type="email"
            id="email"
            class="form-input"
            placeholder="vas@email.com"
            required
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Lozinka</label>
          <input
            type="password"
            id="password"
            class="form-input"
            placeholder="••••••••"
            required
          >
        </div>

        <div class="form-error" id="errorMessage"></div>

        <button type="submit" class="btn btn-primary btn-submit">
          Prijavi se
        </button>
      </form>

      <div class="auth-footer">
        Nemate nalog? <a href="register.html">Registrujte se</a>
      </div>

      <div class="auth-footer" style="border: none; padding-top: 1rem;">
        <a href="index.html">← Nazad na početnu</a>
      </div>
    </div>
  </div>

  <script src="js/mockData.js"></script>
  <script src="js/dataManager.js"></script>
  <script src="js/navbar.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorMessage = document.getElementById('errorMessage');

      const result = dataManager.login(email, password);

      if (result.success) {
        window.location.href = 'dashboard.html';
      } else {
        errorMessage.textContent = result.error;
        errorMessage.classList.add('show');
      }
    });

    // Check if already logged in
    if (dataManager.isLoggedIn()) {
      window.location.href = 'dashboard.html';
    }
  </script>
</body>
</html>
